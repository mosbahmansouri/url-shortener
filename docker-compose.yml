services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: shortener
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener"]
      interval: 3s
      retries: 10
  redis:
    image: redis:7
  api:
    env_file:
       .env
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://shortener:secret@db/shortener
      REDIS_URL: redis://redis:6379/0
    volumes: [./app:/code/app]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
volumes:
  pgdata: